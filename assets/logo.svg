<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ct-grad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <!-- ~12% margin around all elements, high-contrast badge on both light & dark themes -->
  <rect x="14" y="14" width="100" height="100" rx="24" fill="#182230" stroke="url(#ct-grad)" stroke-width="5"/>
  <!-- Tree branches -->
  <path d="M44 44 V86 H76 M44 64 H76" fill="none" stroke="url(#ct-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Root node -->
  <circle cx="44" cy="40" r="10" fill="#38BDF8"/>
  <!-- Subchat nodes -->
  <circle cx="84" cy="64" r="9" fill="#34D399"/>
  <circle cx="84" cy="86" r="9" fill="#FBBF24"/>
  <!-- Mini context bar top-right -->
  <rect x="64" y="34" width="32" height="10" rx="5" fill="#2A394D"/>
  <rect x="64" y="34" width="21" height="10" rx="5" fill="#34D399"/>
</svg>
